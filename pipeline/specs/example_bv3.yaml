# Đặc tả thí nghiệm mẫu: tái tạo B-V3 (mycore + DOT4 + REQ, firmware A-V1+DOT4+C1+REQ)
name: example_bv3
model: m1s                      # model/ + golden Python hiện có
firmware:
  source: experiment/m1s/main.c
  flags: [-DOPT_KERNELS, -DUSE_DOT4, -DCONV1_DOT4, -DUSE_REQ]   # KIỂM lại tên cờ thật trong Makefile
core:
  name: mycore
  rtl_params: {FAST_ADDR: 1, WITH_DOT4: 1, WITH_REQ: 1, WITH_MULDIV: 1}
  timing_model: pipeline/cdp/iss/timing/mycore.yaml
clock_mhz: 27
budget: {lut4: 20736, mult18x18: 48, bsram_blocks: 46, fmax_min_mhz: 27}
evaluate: {images: 10, iss: true, verilator: true, kit: true}
expect:                         # chỉ dùng ở S1 để kiểm tái lập
  total_cycles: 365992
